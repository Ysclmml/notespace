<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">NoteSpace Paper and Ink prototype</title>
  <desc id="desc">A desktop Markdown editor with a workspace tree, browser-like tabs, navigation controls, a single-canvas document, and a status bar.</desc>
  <defs>
