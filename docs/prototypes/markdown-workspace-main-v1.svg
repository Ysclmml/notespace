      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
      .mono { font-family: "SFMono-Regular", Menlo, monospace; }
      .muted { fill: #747d8c; }
      .ink { fill: #20242b; }
      .body { fill: #414854; }
      .link { fill: #3568e8; }
      .line { stroke: #e3e6eb; }
    </style>
  </defs>

