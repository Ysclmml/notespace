    <text class="ink" x="0" y="154" font-size="25" font-weight="720">今天的阅读顺序</text>
    <line class="line" x1="0" y1="168" x2="720" y2="168"/>
    <text class="body" x="10" y="204" font-size="15">1.</text>
    <text class="body" x="38" y="204" font-size="15">先读</text>
    <text class="link" x="78" y="204" font-size="15" text-decoration="underline">产品设计</text>
    <text class="body" x="142" y="204" font-size="15">，了解单画布编辑和 Paper &amp; Ink 风格。</text>
    <text class="body" x="10" y="236" font-size="15">2.</text>
    <text class="body" x="38" y="236" font-size="15">再读</text>
    <text class="link" x="78" y="236" font-size="15" text-decoration="underline">浏览器式导航</text>
    <text class="body" x="174" y="236" font-size="15">，体验 Tab、前进和后退。</text>
    <text class="ink" x="0" y="296" font-size="25" font-weight="720">文档地图</text>
