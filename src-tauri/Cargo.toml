[package]
name = "notespace"
version = "0.1.0"
description = "NoteSpace, a local-first Markdown and text editor"
edition = "2021"
license = "UNLICENSED"
publish = false
default-run = "notespace"

[lib]
name = "notespace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
notify = "=8.2.0"
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
png = { version = "=0.18.1", default-features = false }
rfd = { version = "=0.17.2", default-features = true }
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
trash = "=5.2.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary"] }
