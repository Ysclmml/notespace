[package]
name = "notespace"
version = "0.2.1"
description = "NoteSpace, a local-first Markdown and text editor"
edition = "2021"
license = "UNLICENSED"
publish = false
default-run = "notespace"

[lib]
name = "notespace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
mdns-sd = { version = "=0.21.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["protocol-asset"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
if-addrs = "=0.15.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
notify = "=8.2.0"
png = { version = "=0.18.1", default-features = false }
quick-xml = { version = "=0.41.0", default-features = false }
regex = "=1.13.1"
rfd = { version = "=0.17.2", default-features = true }
trash = "=5.2.6"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSBitmapImageRep", "NSImageRep", "NSPrintInfo", "NSPrintOperation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSURL", "NSGeometry"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebView", "objc2-app-kit"] }
