[package]
name = "markdown-workspace"
version = "0.1.0"
description = "A local-first Markdown editing and browsing workspace"
edition = "2021"
license = "UNLICENSED"
publish = false
default-run = "markdown-workspace"

[features]
default = []
host-release-smoke = []
ipc-transport-spike = []

[lib]
name = "markdown_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
schemars = { version = "=1.2.2", default-features = false, features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = [] }
tauri = { version = "=2.11.5", features = [] }
ts-rs = { version = "=12.0.1", default-features = false, features = ["serde-compat"] }

[dev-dependencies]
uuid = { version = "=1.26.0", features = ["v4"] }
