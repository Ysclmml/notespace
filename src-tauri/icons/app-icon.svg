<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">NoteSpace Paper Portal application icon</title>
  <desc id="desc">A warm paper tile containing a Markdown page folded into a deep blue note space.</desc>

  <defs>
    <linearGradient id="tile" x1="180" y1="118" x2="844" y2="906" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf8" />
      <stop offset="1" stop-color="#f2eadc" />
    </linearGradient>
    <linearGradient id="paper" x1="258" y1="274" x2="704" y2="836" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf8" />
      <stop offset="1" stop-color="#f8f0e3" />
    </linearGradient>
    <linearGradient id="portal" x1="410" y1="180" x2="790" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#102c61" />
      <stop offset="1" stop-color="#071f49" />
    </linearGradient>
    <linearGradient id="fold" x1="594" y1="272" x2="746" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2d6cff" />
      <stop offset="1" stop-color="#1553e8" />
    </linearGradient>

  </defs>

  <!-- Transparent outside the rounded application tile. -->
  <rect x="74" y="90" width="876" height="854" rx="196" fill="#11264a" opacity="0.14" />
  <rect x="74" y="68" width="876" height="876" rx="196" fill="url(#tile)" stroke="#e7ded0" stroke-width="4" />

  <!-- The rear sheet is the navigable “space” behind the active note. -->
  <rect
    x="350"
    y="194"
    width="486"
    height="654"
    rx="82"
    fill="#071a3b"
    opacity="0.18"
    transform="rotate(-7 593 521)"
  />
  <rect
    x="350"
    y="174"
    width="486"
    height="654"
    rx="82"
    fill="url(#portal)"
    transform="rotate(-7 593 501)"
  />

  <!-- Front Markdown page. Its corner is folded into the blue space behind it. -->
  <path
    d="M286 264h292c34 0 57 10 81 34l72 72c24 24 34 47 34 81v331c0 44-36 80-80 80H286c-44 0-80-36-80-80V344c0-44 36-80 80-80Z"
    fill="#0c234a"
    opacity="0.16"
    transform="translate(0 18)"
  />
  <path
    d="M286 264h292c34 0 57 10 81 34l72 72c24 24 34 47 34 81v331c0 44-36 80-80 80H286c-44 0-80-36-80-80V344c0-44 36-80 80-80Z"
    fill="url(#paper)"
  />
  <path
    d="M590 266v91c0 41 33 74 74 74h97c-4-23-15-43-34-62l-69-69c-20-20-43-31-68-34Z"
    fill="url(#fold)"
  />
  <path
    d="M590 266v91c0 41 33 74 74 74h97"
    fill="none"
    stroke="#0e43c7"
    stroke-opacity="0.28"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Geometric Markdown hash: four deliberate strokes, never font-dependent. -->
  <g fill="#0b295b">
    <rect x="350" y="427" width="42" height="194" rx="21" transform="rotate(8 371 524)" />
    <rect x="456" y="427" width="42" height="194" rx="21" transform="rotate(8 477 524)" />
    <rect x="318" y="477" width="226" height="39" rx="19.5" />
    <rect x="307" y="551" width="226" height="39" rx="19.5" />
  </g>

  <!-- Three compact content lines keep the page readable at Dock size. -->
  <rect x="310" y="672" width="334" height="28" rx="14" fill="#0b295b" />
  <rect x="310" y="726" width="310" height="28" rx="14" fill="#2064f3" />
  <rect x="310" y="780" width="274" height="28" rx="14" fill="#0b295b" />
</svg>
